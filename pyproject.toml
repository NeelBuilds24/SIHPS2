[project]
name = "sentinelgraph"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "joblib>=1.3.0",
    "shap>=0.45.0",
    "networkx>=3.2.0",
    "plotly>=5.19.0",
    "requests>=2.31.0"
]

[tool.vercel]
entrypoint = "backend.main:app"